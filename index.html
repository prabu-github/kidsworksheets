<style>
  :root { --bg:#f6f3ea; --card:#fff; --ink:#2b2b2b; --muted:#6b6b6b; --accent:#2f6b3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1f1c; --card:#2a2d29; --ink:#ececec; --muted:#a9a9a9; --accent:#7fc28c; }
  }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:0 0 8px; }
  p { color:var(--muted); }
  a.card { display:block; background:var(--card); padding:18px 20px; border-radius:12px; margin:12px 0;
           color:var(--ink); text-decoration:none; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  a.card strong { color:var(--accent); display:block; font-size:1.1rem; }
</style>
